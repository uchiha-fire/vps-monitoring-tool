name: Build & Release Multi-Platform App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      create_release:
        description: 'Publish binaries to GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage deb rpm
            artifact_name: dockmon-linux
          - os: windows-latest
            target: --win nsis portable
            artifact_name: dockmon-windows
          - os: macos-latest
            target: --mac dmg zip --arm64 --x64
            artifact_name: dockmon-macos

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Test Suite (TDD)
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Package Application Binaries
        run: npx electron-builder ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 30

      - name: Upload Release Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
